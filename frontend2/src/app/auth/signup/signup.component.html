<div class="min-h-screen flex items-center justify-center bg-pink-100">
  <div class="bg-black p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-pink-300 mb-6">Sign Up</h1>
    
    <div class="space-y-4">
      <input 
        [(ngModel)]="username"
        placeholder="Username"
        class="w-full px-4 py-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-pink-500"
      >
      
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Password"
        class="w-full px-4 py-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-pink-500"
      >
      
      <button
        (click)="signup()"
        class="w-full bg-pink-500 text-white py-2 rounded hover:bg-pink-600 transition"
      >
        Create Account
      </button>
      
      <p class="text-center text-sm mt-4 text-pink-200">
        Already have an account? 
        <a routerLink="/login" class="text-pink-400 hover:underline">Login</a>
      </p>
    </div>
  </div>
</div>
