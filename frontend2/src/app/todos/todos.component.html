<div class="min-h-screen bg-pink-100 p-4">
  <div class="max-w-md mx-auto bg-black rounded-lg shadow-md p-6">

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-pink-300">TaskTrackr</h1>
      <button 
        (click)="logout()"
        class="text-pink-400 hover:text-pink-600 text-sm"
      >
        Logout
      </button>
    </div>

    <div class="flex mb-6">
      <input
        [(ngModel)]="newTodo"
        placeholder="Plan your next move..."
        class="flex-1 px-4 py-2 border rounded-l bg-white focus:outline-none focus:ring-2 focus:ring-pink-500"
        (keyup.enter)="addTodo()"
      >
      <button
        (click)="addTodo()"
        class="bg-pink-500 text-white px-4 rounded-r hover:bg-pink-600 transition"
      >
        Add
      </button>
    </div>

    <ul class="space-y-2">
      <li 
        *ngFor="let todo of todos"
        class="flex items-center p-3 border rounded hover:bg-pink-50"
      >

        <div *ngIf="!isEditing(todo)" class="flex items-center w-full">
          
          <span 
            [class.line-through]="todo.completed"
            [class.text-pink-400]="todo.completed"
            class="flex-1 text-white"
          >
            {{ todo.title }}
          </span>
          
          <div class="flex space-x-2">
            <button
              (click)="startEditing(todo)"
              class="text-pink-400 hover:text-pink-600"
            >
              ✏️
            </button>
            <button
              (click)="deleteTodo(todo._id!)"
              class="text-red-400 hover:text-red-600"
            >
              ✕
            </button>
          </div>
        </div>

        <div *ngIf="isEditing(todo)" class="flex items-center w-full">
          <input
            [(ngModel)]="todo.title"
            class="flex-1 px-3 py-1 border rounded mr-2 bg-white focus:outline-none focus:ring-2 focus:ring-pink-500"
            (keyup.enter)="saveEdit(todo)"
          >
          <button
            (click)="saveEdit(todo)"
            class="bg-pink-500 text-white px-3 py-1 rounded mr-2 hover:bg-pink-600"
          >
            💾
          </button>
          <button
            (click)="cancelEdit(todo)"
            class="bg-gray-300 px-3 py-1 rounded hover:bg-gray-400"
          >
            Cancel
          </button>
        </div>
      </li>
    </ul>
  </div>
</div>
